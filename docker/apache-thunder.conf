ServerName localhost

<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Do not expose project files if a misconfigured volume or proxy maps the
# repository root instead of public/.
<DirectoryMatch "/var/www/html/(app|bin|database|docker|routes|storage)">
    Require all denied
</DirectoryMatch>
